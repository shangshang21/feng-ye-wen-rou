<script>
'use strict';
const TAU=Math.PI*2,$=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,eo=t=>1-Math.pow(1-t,3);

const GP={wall:'#2e3b72',wall2:'#34437d',desk:'#b9794f',deskF:'#8e5a3b',deskD:'#7b4b30',lap:'#9097ae',lapD:'#6f7692',scr:'#0e1430',paper:'#f3e6c8',jk:'#262839',skin:'#f3d3ba',hair:'#2b2530',or:'#ec8547',salmon:'#e8786a',pink:'#f29ab0',yel:'#f2cc6b',mint:'#9ad8c4',lil:'#b9a9e6'};

function gJ(seed){const r=rng(seed*977+GF*131);return[(r()-.5)*2.2,(r()-.5)*2.2,(r()-.5)*.012];}
function pcut(c,fn,fill,o={}){

  c.save();c.shadowColor='rgba(6,8,28,.5)';c.shadowBlur=9*sh;c.shadowOffsetX=2.5*sh;c.shadowOffsetY=5*sh;c.beginPath();fn(c);c.fillStyle=fill;c.fill();c.restore();

function flat(c,fn,fill,alpha=1){c.save();c.globalAlpha=alpha;c.beginPath();fn(c);c.fillStyle=fill;c.fill();c.restore();}
function G(c,seed,x,y,rot,fn,jit=true){const j=jit?gJ(seed):[0,0,0];c.save();c.translate(x+j[0],y+j[1]);c.rotate(rot+j[2]);fn();c.restore();}
function gLine(c,pts,w,col,alpha=1){c.save();c.globalAlpha=alpha;c.strokeStyle=col;c.lineWidth=w;c.lineCap=c.lineJoin='round';c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();c.restore();}

function gBackground(){
  const cv=document.createElement('canvas');cv.width=1280;cv.height=720;const c=cv.getContext('2d');
  c.fillStyle=GP.wall;c.fillRect(0,0,1280,720);

  pcut(c,RR(120,590,460,110,12),GP.deskD,{sh:.4});pcut(c,RR(700,590,460,110,12),GP.deskD,{sh:.4});
  pcut(c,RR(330,632,60,14,7),'#d8b48a',{sh:.3});pcut(c,RR(910,632,60,14,7),'#d8b48a',{sh:.3});

  pcut(c,EL(1195,500,56,12),'#6a4b3a',{sh:.7});pcut(c,RR(1190,330,10,170,3),'#6a4b3a',{sh:.6});
  // laptop
  pcut(c,RR(578,486,364,18,8),'#a2a8bd',{sh:1.2});
  pcut(c,RR(598,248,324,240,14),GP.lap,{sh:1.2});pcut(c,RR(612,262,296,212,8),GP.scr,{flat:true,sh:0});
  return cv;
}
function gScreen(c,tt){
  c.save();c.translate(760,368);
  for(let i=0;i<6;i++)gLine(c,[[-132,-84+i*30],[-132+[60,100,40,120,80,50][i],-84+i*30]],6,'rgba(150,170,255,.18)');
  const fixed=tt>4.5,pop=fixed?back(seg(tt,4.5,4.9)):back(seg(tt,.1,.5));

  if(!fixed){const k=clamp(1-seg(tt,4.2,4.5))*pop+(tt<.5?0:0);c.save();c.scale(Math.max(.01,k),Math.max(.01,k));pcut(c,RR(-110,-64,220,128,10),GP.paper,{sh:.5});flat(c,RR(-110,-64,220,28,10),'#e8647b');flat(c,RR(-110,-50,220,14,0),'#e8647b');
    c.save();c.fillStyle=GP.paper;c.font='bold 17px ui-monospace,Menlo,monospace';c.textAlign='left';c.textBaseline='middle';c.fillText('ERROR  37',-96,-50);c.restore();
    pcut(c,PL([[0,-24],[24,18],[-24,18]]),'#e8647b',{sh:.3});gLine(c,[[0,-12],[0,4]],5,GP.paper);flat(c,EL(0,11,3,3),GP.paper);
    gLine(c,[[-92,34],[-20,34]],5,'rgba(60,40,50,.3)');gLine(c,[[-92,48],[40,48]],5,'rgba(60,40,50,.3)');c.restore();}
  else{c.save();c.scale(pop,pop);pcut(c,RR(-110,-64,220,128,10),'#bfe8c8',{sh:.5});flat(c,RR(-110,-64,220,28,10),'#58b878');flat(c,RR(-110,-50,220,14,0),'#58b878');
    c.save();c.fillStyle=GP.paper;c.font='bold 17px ui-monospace,Menlo,monospace';c.textAlign='left';c.textBaseline='middle';c.fillText('FIXED',-96,-50);c.restore();
    gLine(c,[[-34,8],[-8,34],[40,-18]],14,'#2f8a4f');gLine(c,[[-92,52],[40,52]],5,'rgba(40,90,60,.3)');c.restore();}
  c.restore();
}
function gMe(c,seed,x,y,s,o={}){
  const {rot=0,eyes='open',look=0,legs=1,hop=0,wave=0,sp=1,blush=.8,tt=0,squash=1,cover=0}=o;const cv=cover>.02;
  G(c,seed,x,y-hop,rot,()=>{
    c.scale(s,s*squash);const B=26*legs;
    if(legs>0)for(const [lx,ph] of[[-40,0],[-24,1.3],[24,2.1],[40,3.4]]){const k=Math.sin(tt*10+ph)*(o.walk?6:0);pcut(c,RR(lx-5+k*.4,-B,10,B+3,5),'#b85a2a',{sh:.4});}
    if(!cv)pcut(c,RR(-76,-B-56,16,26,7),'#e27a3f',{sh:.5});
    if(cv){}else if(wave>0){c.save();c.translate(64,-B-44);c.rotate(-1.9+Math.sin(tt*14)*.3*wave+(1-wave)*1.4);pcut(c,RR(-4,-8,34,16,7),'#e27a3f',{sh:.5});c.restore();}else pcut(c,RR(60,-B-56,16,26,7),'#e27a3f',{sh:.5});

    for(const m of[-1,1]){const ex=m*24+look*6,ey=-B-52;
      if(eyes==='open'){flat(c,EL(ex,ey,5.5,7.5),'#3a2016');flat(c,EL(ex+2,ey-3,1.8,1.8),'#fff');}
      else if(eyes==='happy')gLine(c,[[ex-9,ey+4],[ex,ey-6],[ex+9,ey+4]],4,'#3a2016');
      else if(eyes==='squeeze')gLine(c,m<0?[[ex-9,ey-8],[ex+7,ey],[ex-9,ey+8]]:[[ex+9,ey-8],[ex-7,ey],[ex+9,ey+8]],4,'#3a2016');

  });
}

function gBlanket(c,seed,x,y,rot,sx,sy,wob=0,ghost=false){

function bass(m,when,dur,vel){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=mf(m);env(g,when,vel,.02,dur);o.connect(g);g.connect(bus);o.start(when);o.stop(when+dur+.05);live.push(o);}
function pad(m,when,dur,vel){const o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();o.type='triangle';o.frequency.value=mf(m);o.detune.value=(Math.random()-.5)*8;lp.type='lowpass';lp.frequency.value=900;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vel,when+.6);g.gain.setValueAtTime(vel,when+dur-.3);g.gain.linearRampToValueAtTime(0,when+dur+.5);o.connect(lp);lp.connect(g);g.connect(bus);o.start(when);o.stop(when+dur+.6);live.push(o);}
function noise(when,dur,type,f0,f1,q,vel,att=.004){const s=AC.createBufferSource();s.buffer=noiseBuf;const bp=AC.createBiquadFilter();bp.type=type;bp.Q.value=q;bp.frequency.setValueAtTime(f0,when);bp.frequency.exponentialRampToValueAtTime(f1,when+dur);const g=AC.createGain();env(g,when,vel,att,dur);s.connect(bp);bp.connect(g);g.connect(bus);s.start(when,Math.random());s.stop(when+dur+.05);live.push(s);}
function tone(type,f0,f1,when,dur,vel){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,when);o.frequency.exponentialRampToValueAtTime(f1,when+dur);env(g,when,vel,.004,dur);o.connect(g);g.connect(bus);o.start(when);o.stop(when+dur+.05);live.push(o);}
function sfx(k,when,e){
  if(k==='step')noise(when,.06,'bandpass',2600+Math.random()*700,2600,2,.07);
  else if(k==='whoosh')noise(when,e.d||.4,'bandpass',500,2600,.8,.12,.08);
  else if(k==='click'){tone('square',190,120,when,.04,.07);noise(when,.03,'highpass',3000,3000,1,.08);}
  else if(k==='pop')tone('sine',420,900,when,.07,.1);
  else if(k==='chirp'){tone('sine',3000,4300,when,.09,.035);tone('sine',4300,3300,when+.1,.1,.03);tone('sine',3200,4400,when+.24,.09,.03);}
  else if(k==='boop'){tone('triangle',660,520,when,.28,.12);}
}
function startAudio(ft){ensureAudio();if(!AC)return;if(AC.state==='suspended')AC.resume();const base=AC.currentTime+.06-ft;for(const e of EVENTS){if(e.t<ft-.001)continue;const w=base+e.t;if(e.k==='box')box_(e.m,w,e.d,e.v);else if(e.k==='bass')bass(e.m,w,e.d,e.v);else if(e.k==='pad')pad(e.m,w,e.d,e.v);else sfx(e.k,w,e);}}
function stopAudio(){for(const n of live){try{n.stop();}catch(e){}}live=[];}

/* ============================================================== player */
const cv=$('film'),ctx=cv.getContext('2d'),cover=$('cover'),hintEl=$('hint'),playBtn=$('playBtn'),muteBtn=$('muteBtn'),scrub=$('scrub'),timeEl=$('time');
let T0=0,started=false,playing=false,t0perf=0,t0film=0,lastF=-1,wasPlaying=false;
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function renderFrame(t){drawG(ctx,Math.min(DUR-.001,t));}
function ui(){scrub.value=T0.toFixed(2);scrub.style.setProperty('--p',`${T0/DUR*100}%`);timeEl.textContent=`${fmt(T0)} / ${fmt(DUR)}`;playBtn.querySelector('span').textContent=playing?'暂停':'播放';}
function play(){if(T0>=DUR-.05)T0=0;started=true;playing=true;cover.hidden=true;t0perf=performance.now();t0film=T0;lastF=-1;startAudio(T0);ui();requestAnimationFrame(loop);}
function pause(){playing=false;stopAudio();ui();}
function loop(now){if(!playing)return;T0=Math.max(t0film,t0film+(now-t0perf)/1000);
  if(T0>=DUR){T0=DUR;renderFrame(DUR-.001);playing=false;live=[];hintEl.textContent='再看一遍';cover.hidden=false;ui();return;}
  const f=Math.floor(T0*12);if(f!==lastF){lastF=f;renderFrame(T0);}ui();requestAnimationFrame(loop);}
function seek(t){T0=clamp(t,0,DUR-.001);started=true;cover.hidden=true;lastF=-1;renderFrame(T0);if(playing){stopAudio();t0perf=performance.now();t0film=T0;startAudio(T0);}ui();}
cover.onclick=play;playBtn.onclick=()=>playing?pause():play();
muteBtn.onclick=()=>{muted=!muted;if(master&&AC)master.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.05);muteBtn.textContent=muted?'声音：关':'声音：开';};
scrub.addEventListener('pointerdown',()=>{wasPlaying=playing;if(playing)pause();});
scrub.addEventListener('input',()=>seek(+scrub.value));
scrub.addEventListener('change',()=>{if(wasPlaying){wasPlaying=false;play();}});
document.addEventListener('keydown',e=>{if(e.code!=='Space')return;const tg=e.target;if(tg&&(tg.tagName==='BUTTON'||tg.tagName==='INPUT'))return;e.preventDefault();playing?pause():play();});
window.RENDER=t=>{T0=t;started=true;cover.hidden=true;renderFrame(t);};
renderFrame(8);ui();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{if(!started)renderFrame(8);});


/* cover mode: open the page as  .../#cover=SECONDS  to show that single frame full-bleed (used to make the hub's thumbnails) */
if(/^#cover=/.test(location.hash)){const st=document.createElement('style');st.textContent='html,body{background:#000}main{padding:0!important;max-width:none!important;gap:0!important}header,.controls,footer,.cover{display:none!important}.film{position:fixed!important;inset:0;aspect-ratio:auto!important;border-radius:0!important;box-shadow:none!important}';document.head.appendChild(st);const ct=parseFloat(location.hash.slice(7))||0;renderFrame(ct);((document.fonts&&document.fonts.ready)||Promise.resolve()).then(()=>renderFrame(ct));}
</script>

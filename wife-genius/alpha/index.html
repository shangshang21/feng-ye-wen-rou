<script>
'use strict';
const TAU=Math.PI*2,$=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,eo=t=>1-Math.pow(1-t,3);
const back=t=>{t=clamp(t);const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const FONT='"Yuanti SC","Hiragino Maru Gothic ProN","PingFang SC","Microsoft YaHei",sans-serif';
const RR=(x,y,w,h,r)=>c=>c.roundRect(x,y,w,h,r);
const EL=(x,y,rx,ry,rot=0)=>c=>{c.moveTo(x+rx,y);c.ellipse(x,y,rx,ry,rot,0,TAU);};
const PL=(pts,close=true)=>c=>{pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));if(close)c.closePath();};
const STAR=(x,y,r,k=.3)=>c=>{for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,rr=i%2?r*k:r;i?c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):c.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();};
const HEART=(x,y,s)=>c=>{c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.7,y-s*1.2,x,y-s*.4);c.bezierCurveTo(x+s*.7,y-s*1.2,x+s*1.5,y-s*.1,x,y+s*.9);c.closePath();};
// smooth closed blob through points (quadratic midpoints)
const BLOB=pts=>c=>{const n=pts.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(pts[n-1],pts[0]);c.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const p=pts[i],e=m(p,pts[(i+1)%n]);c.quadraticCurveTo(p[0],p[1],e[0],e[1]);}c.closePath();};
function grain(w,h,seed,amp,base=128){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),r=rng(seed);for(let i=0;i<im.data.length;i+=4){const v=base+(r()-.5)*amp*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);return c;}

/* ============================================================== α 四格 · riso */
const AI={pink:'#ff4f93',yellow:'#ffd21a',indigo:'#262b7a'},PAPER='#f5edda',AOFF={pink:[3,2],yellow:[-2,-2],indigo:[0,0]};
const apat={};
function adots(ctx,col,d){const key=col+d.toFixed(2);let c=apat[key];if(!c){const s=8;c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.arc(s/2,s/2,Math.sqrt(d*s*s/Math.PI),0,TAU);x.fill();apat[key]=c;}
  const m=ctx.getTransform(),sc=Math.hypot(m.a,m.b)||1,p=ctx.createPattern(c,'repeat');p.setTransform(new DOMMatrix().rotate(45).scale(1/sc));return p;}
function afill(c,path,ink,d=1){const o=AOFF[ink];c.save();c.globalCompositeOperation='multiply';c.translate(o[0],o[1]);c.beginPath();path(c);c.fillStyle=d>=.98?AI[ink]:adots(c,AI[ink],d);c.fill();c.restore();}
function astroke(c,path,w=5,ink='indigo'){c.save();c.globalCompositeOperation='multiply';c.lineWidth=w;c.lineJoin=c.lineCap='round';c.strokeStyle=AI[ink];c.beginPath();path(c);c.stroke();c.restore();}
function aknock(c,path,a=1){c.save();c.globalAlpha=a;c.beginPath();path(c);c.fillStyle=PAPER;c.fill();c.restore();}
function atext(c,s,x,y,fs,ink='indigo',al='center',rot=0){c.save();c.globalCompositeOperation='multiply';c.translate(x,y);c.rotate(rot);c.font=`bold ${fs}px ${FONT}`;c.textAlign=al;c.textBaseline='middle';c.fillStyle=AI[ink];c.fillText(s,0,0);c.restore();}

function aHe(c,x,y,s,o={}){
  const {eyes='open',mouth='smile',blush=0,tilt=0,look=0}=o;
  c.save();c.translate(x,y);c.scale(s,s);
  afill(c,cc=>{cc.moveTo(-215,320);cc.lineTo(-215,175);cc.quadraticCurveTo(-205,112,-130,100);cc.lineTo(130,100);cc.quadraticCurveTo(205,112,215,175);cc.lineTo(215,320);cc.closePath();},'indigo');
  for(const m of[-1,1])for(let i=0;i<3;i++){c.save();c.strokeStyle=PAPER;c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(m*(138+i*17),116+i*14);c.quadraticCurveTo(m*(190+i*10),122+i*14,m*(200+i*12),190+i*8);c.stroke();c.restore();}
  afill(c,RR(-24,60,48,56,10),'pink',.28);
  aknock(c,RR(-56,92,112,56,16));astroke(c,RR(-56,92,112,56,16),4);astroke(c,PL([[0,98],[0,146]],false),3);
  c.save();c.translate(0,70);c.rotate(tilt);c.translate(0,-70);
  const head=RR(-80,-96,160,184,66);
  for(const m of[-1,1]){afill(c,EL(m*82,0,14,26),'pink',.28);astroke(c,EL(m*82,0,14,26),4);}
  aknock(c,head);afill(c,head,'pink',.2);
  if(blush>0)for(const m of[-1,1])afill(c,EL(m*52,44,24,13),'pink',.35+.5*blush);
  astroke(c,head,5);
  afill(c,cc=>{cc.moveTo(-84,-18);cc.bezierCurveTo(-98,-128,-44,-142,0,-142);cc.bezierCurveTo(44,-142,98,-128,84,-18);cc.lineTo(74,-40);cc.lineTo(56,-62);cc.lineTo(40,-34);cc.lineTo(22,-66);cc.lineTo(5,-38);cc.lineTo(-14,-64);cc.lineTo(-34,-34);cc.lineTo(-52,-58);cc.lineTo(-68,-34);cc.lineTo(-84,-50);cc.closePath();},'indigo');
  for(const m of[-1,1]){const L=RR(m*42-32+(m<0?-2:2),-30,64,52,14);aknock(c,L);afill(c,L,'indigo',.1);
    const ex=m*42+look*6,ey=-4;
    if(eyes==='open'){afill(c,EL(ex,ey,7,9),'indigo');}
    else if(eyes==='wide'){aknock(c,EL(ex,ey,13,15));astroke(c,EL(ex,ey,13,15),3);afill(c,EL(ex+look*3,ey,5,6),'indigo');}
    else if(eyes==='happy')astroke(c,cc=>{cc.moveTo(ex-14,ey+6);cc.quadraticCurveTo(ex,ey-14,ex+14,ey+6);},5);
    else if(eyes==='squeeze')astroke(c,cc=>{if(m<0){cc.moveTo(ex-12,ey-8);cc.lineTo(ex+8,ey);cc.lineTo(ex-12,ey+8);}else{cc.moveTo(ex+12,ey-8);cc.lineTo(ex-8,ey);cc.lineTo(ex+12,ey+8);}},5);
    else astroke(c,PL([[ex-13,ey+2],[ex+13,ey+6]],false),5); // tired
    astroke(c,L,9);}
  astroke(c,PL([[-10,-14],[10,-14]],false),7);
  if(mouth==='smile')astroke(c,cc=>{cc.moveTo(-22,52);cc.quadraticCurveTo(0,76,22,52);},5);
  else if(mouth==='big'){aknock(c,cc=>{cc.moveTo(-26,50);cc.quadraticCurveTo(0,100,26,50);cc.closePath();});afill(c,cc=>{cc.moveTo(-26,50);cc.quadraticCurveTo(0,100,26,50);cc.closePath();},'pink',.6);astroke(c,cc=>{cc.moveTo(-26,50);cc.quadraticCurveTo(0,100,26,50);cc.closePath();},5);}
  else if(mouth==='o'){aknock(c,EL(0,58,11,14));afill(c,EL(0,58,11,14),'pink',.7);astroke(c,EL(0,58,11,14),4);}
  else if(mouth==='wobble')astroke(c,cc=>{cc.moveTo(-22,58);cc.quadraticCurveTo(-11,48,0,58);cc.quadraticCurveTo(11,68,22,58);},5);
  else astroke(c,PL([[-18,58],[18,58]],false),5);
  c.restore();c.restore();
}
function aMe(c,x,y,s,o={}){
  const {eyes:eyes0='open',look=0,sp=1,blush=.6,cover=0,t=0}=o;
  c.save();c.translate(x,y);c.scale(s,s);
  for(const lx of[-44,-22,22,44]){astroke(c,PL([[lx,50],[lx+(lx<0?-3:3),78]],false),9);}
  const body=RR(-72,-56,144,112,26);
  afill(c,body,'yellow');afill(c,body,'pink',.5+.3*blush);
  aknock(c,RR(-58,-46,54,13,6),.55);
  astroke(c,body,5);
  for(const m of[-1,1]){const ex=m*28+look*6,ey=-6;const eyes=eyes0==='peek'?(m<0?'open':'squeeze'):eyes0;
    if(eyes==='open'){afill(c,EL(ex,ey,6.5,9),'indigo');aknock(c,EL(ex+2,ey-3,2,2));}
    else if(eyes==='happy')astroke(c,cc=>{cc.moveTo(ex-10,ey+5);cc.quadraticCurveTo(ex,ey-10,ex+10,ey+5);},5);
    else if(eyes==='squeeze')astroke(c,cc=>{if(m<0){cc.moveTo(ex-9,ey-8);cc.lineTo(ex+7,ey);cc.lineTo(ex-9,ey+8);}else{cc.moveTo(ex+9,ey-8);cc.lineTo(ex-7,ey);cc.lineTo(ex+9,ey+8);}},5);
    else astroke(c,PL([[ex-9,ey],[ex+9,ey]],false),5);
    afill(c,EL(m*46+look*3,14,13,7),'pink',.5+.5*blush);}
  astroke(c,cc=>{cc.moveTo(-7+look*6,10);cc.quadraticCurveTo(0+look*6,17,7+look*6,10);},4);
  for(const m of[-1,1]){c.save();c.translate(m*70,12);c.scale(m,1);c.rotate(-cover*3.05);const arm=RR(-4,-10,lerp(20,50,cover),20,10);afill(c,arm,'yellow');afill(c,arm,'pink',.45);astroke(c,arm,4.5);c.restore();}
  if(sp>0){for(const [sx,sy,r] of[[-62,-92,20],[64,-100,26]]){const rr=r*sp;afill(c,STAR(sx,sy,rr),'yellow');astroke(c,STAR(sx,sy,rr),3.5);}}
  c.restore();
}
function aBubble(c,x,y,w,h,lines,tail,o={}){
  const {pop=1,fs=30,ink='indigo',shake=0}=o;if(pop<=0)return;
  c.save();c.translate(x+(shake?Math.sin(o.t*50)*shake:0),y);const sc=back(pop);c.scale(sc,sc);
  const [tx,ty]=tail,up=ty<0,bx=clamp(tx,-w/2+50,w/2-50);
  const shape=cc=>{cc.roundRect(-w/2,-h/2,w,h,28);cc.moveTo(bx-20,up?-h/2+3:h/2-3);cc.lineTo(tx,ty);cc.lineTo(bx+20,up?-h/2+3:h/2-3);cc.closePath();};
  c.save();c.globalCompositeOperation='multiply';c.lineWidth=10;c.lineJoin='round';c.strokeStyle=AI.indigo;c.beginPath();shape(c);c.stroke();c.restore();
  c.save();c.beginPath();shape(c);c.fillStyle=PAPER;c.fill();c.restore();
  if(o.tint)afill(c,shape,'pink',o.tint);
  const n=lines.length;lines.forEach((l,i)=>atext(c,l,0,(i-(n-1)/2)*fs*1.3,fs,ink));
  c.restore();
}
function aBurst(c,x,y,r0,r1,n,ink='pink',d=.8,seed=1,rot=0){const r=rng(seed);for(let i=0;i<n;i++){const a=rot+i/n*TAU+(r()-.5)*.1,w=.07;afill(c,PL([[x+Math.cos(a-w)*r0,y+Math.sin(a-w)*r0],[x+Math.cos(a)*r1*(.7+.3*r()),y+Math.sin(a)*r1*(.7+.3*r())],[x+Math.cos(a+w)*r0,y+Math.sin(a+w)*r0]]),ink,d);}}
function aBulb(c,x,y,s,pop){if(pop<=0)return;c.save();c.translate(x,y);c.scale(s*back(pop),s*back(pop));aBurst(c,0,0,40,74,10,'yellow',1,3);afill(c,EL(0,0,28,30),'yellow');aknock(c,RR(-14,24,28,18,5),1);afill(c,RR(-14,24,28,18,5),'indigo',.25);astroke(c,EL(0,0,28,30),4);astroke(c,RR(-14,24,28,18,5),4);astroke(c,PL([[-8,-10],[0,6],[8,-10]],false),3);c.restore();}

const PW=595,PH=315,PX=[30,655],PY=[30,375];
function aPanel(c,idx,tag,pop,t,draw,fade=1){
  if(pop<=0)return;const px=PX[idx%2],py=PY[idx>>1];
  c.save();c.translate(px+PW/2,py+PH/2);const s=lerp(.93,1,eo(pop));c.scale(s,s);c.globalAlpha=clamp(pop*2.2)*fade;
  c.fillStyle='#fbf6ea';c.fillRect(-PW/2,-PH/2,PW,PH);
  c.save();c.beginPath();c.rect(-PW/2,-PH/2,PW,PH);c.clip();draw(c,t);c.restore();
  astroke(c,PL([[-PW/2,-PH/2],[PW/2,-PH/2+1],[PW/2-1,PH/2],[-PW/2+1,PH/2-1]]),9);
  afill(c,RR(-PW/2+10,-PH/2+10,46,46,10),'pink');aknock(c,RR(-PW/2+16,-PH/2+16,34,34,7),.0);
  astroke(c,RR(-PW/2+10,-PH/2+10,46,46,10),4);c.save();c.font=`bold 30px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=PAPER;c.fillText(tag,-PW/2+33,-PH/2+34);c.restore();
  c.restore();
}
function aDesk(c){afill(c,RR(-310,100,620,100,0),'pink',.3);astroke(c,PL([[-310,100],[310,100]],false),7);}
function aCard(c,x,y,w,h,pop){if(pop<=0)return;c.save();c.translate(x,y);c.scale(back(pop),back(pop));aknock(c,RR(-w/2,-h/2,w,h,12));astroke(c,RR(-w/2,-h/2,w,h,12),5);afill(c,RR(-w/2,-h/2,w,26,12),'indigo',.9);for(let i=0;i<3;i++)aknock(c,EL(-w/2+16+i*16,-h/2+13,4,4));c.restore();}


function aBug(c,x,y,s,rot,ph,flip=0){

scrub.addEventListener('pointerdown',()=>{wasPlaying=playing;if(playing)pause();});
scrub.addEventListener('input',()=>seek(+scrub.value));
scrub.addEventListener('change',()=>{if(wasPlaying){wasPlaying=false;play();}});
document.addEventListener('keydown',e=>{if(e.code!=='Space')return;const tg=e.target;if(tg&&(tg.tagName==='BUTTON'||tg.tagName==='INPUT'))return;e.preventDefault();playing?pause():play();});
window.RENDER=t=>{T0=t;started=true;cover.hidden=true;renderFrame(t);};
renderFrame(16.2);ui();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{if(!started)renderFrame(16.2);});


/* cover mode: open the page as  .../#cover=SECONDS  to show that single frame full-bleed (used to make the hub's thumbnails) */
if(/^#cover=/.test(location.hash)){const st=document.createElement('style');st.textContent='html,body{background:#000}main{padding:0!important;max-width:none!important;gap:0!important}header,.controls,footer,.cover{display:none!important}.film{position:fixed!important;inset:0;aspect-ratio:auto!important;border-radius:0!important;box-shadow:none!important}';document.head.appendChild(st);const ct=parseFloat(location.hash.slice(7))||0;renderFrame(ct);((document.fonts&&document.fonts.ready)||Promise.resolve()).then(()=>renderFrame(ct));}
</script>
